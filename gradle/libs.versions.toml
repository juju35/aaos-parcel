[versions]
agp = "9.4.0"
detekt = "1.23.8"
carApp = "1.4.0"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
coroutines = "1.9.0"
work = "2.10.1"
junit = "4.13.2"
orgJson = "20240303"

[libraries]
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-automotive = { module = "androidx.car.app:app-automotive", version.ref = "carApp" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# org.json is a stub in android.jar: the real one for the JVM unit tests.
org-json = { module = "org.json:json", version.ref = "orgJson" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
